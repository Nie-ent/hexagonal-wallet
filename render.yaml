services:
  - type: web
    name: hexagonal-wallet
    runtime: docker
    repo: https://github.com/Nie-ent/hexagonal-wallet
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString

databases:
  - name: wallet-db
    databaseName: walletdb
    user: postgres
    plan: free
